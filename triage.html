<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Triage Dashboard</title><link rel="stylesheet" href="/app.css"></head><body><main class="wrap"><div class="topnav"><a href="/records">เวชระเบียน</a><a href="/triage">Triage</a></div><div class="card"><h1>Triage Dashboard</h1><div class="muted">เรียงตามเวลาที่ Submit · รายการที่รอเกิน 30 นาทีจะแสดงสีแดง</div><div class="row"><input id="key" type="password" placeholder="รหัสผ่าน Triage"><button onclick="login()">เข้าสู่ระบบ</button></div><div id="authmsg" class="error"></div></div><div id="panel" class="hidden"><div class="card toolbar"><button onclick="load()">Refresh</button></div><div id="list" class="list"></div></div></main><script>
let KEY=sessionStorage.getItem('trkey')||'',rows=[];function mins(iso){return Math.floor((Date.now()-Date.parse(iso))/60000)}function time(iso){return new Date(iso).toLocaleTimeString('th-TH',{timeZone:'Asia/Bangkok',hour:'2-digit',minute:'2-digit'})}
async function login(){KEY=document.getElementById('key').value||KEY;sessionStorage.setItem('trkey',KEY);await load()}
async function load(){const r=await fetch('/api/list?role=triage',{headers:{'x-dashboard-key':KEY}});if(!r.ok){document.getElementById('authmsg').textContent='รหัสผ่านไม่ถูกต้อง';return}rows=await r.json();document.getElementById('authmsg').textContent='';document.getElementById('panel').classList.remove('hidden');render()}
function render(){document.getElementById('list').innerHTML=rows.map(r=>{const m=mins(r.submitted_at),late=m>30&&r.triage_status!=='Triage แล้ว';return `<div class="item ${late?'late':''}"><b>${esc(r.queue)}</b><div><b>${esc(r.name_th)}</b><br><span class="muted">Submit ${time(r.submitted_at)} · รอ ${Math.max(0,m)} นาที</span></div><span class="badge">${esc(r.triage_status)}</span><button class="${r.triage_status==='Triage แล้ว'?'secondary':''}" onclick="done('${r.id}')">${r.triage_status==='Triage แล้ว'?'เสร็จแล้ว':'รับ Triage'}</button></div>`}).join('')||'<div class="card muted">ไม่มีรายการภายใน 24 ชั่วโมง</div>'}
async function done(id){await fetch('/api/status',{method:'POST',headers:{'Content-Type':'application/json','x-dashboard-key':KEY},body:JSON.stringify({id,role:'triage',status:'Triage แล้ว'})});await load()}
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
if(KEY){document.getElementById('key').value=KEY;load()}setInterval(()=>{if(KEY)load()},30000);setInterval(render,60000);
</script></body></html>
