<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>เวชระเบียน</title><link rel="stylesheet" href="/app.css"></head><body><main class="wrap"><div class="topnav"><a href="/records">เวชระเบียน</a><a href="/triage">Triage</a></div><div class="card"><h1>Medical Records Dashboard</h1><div class="row"><input id="key" type="password" placeholder="รหัสผ่านเวชระเบียน"><button onclick="login()">เข้าสู่ระบบ</button></div><div id="authmsg" class="error"></div></div><div id="panel" class="hidden"><div class="card toolbar"><button onclick="load()">Refresh</button><input id="search" placeholder="ค้นหา คิว / รหัส / ชื่อ" oninput="render()"></div><div id="list" class="list"></div><div id="detail" class="card hidden"></div></div></main><script>
let KEY=sessionStorage.getItem('mrkey')||'', rows=[]; const labels={queue:'เลขคิว',submitted_at:'เวลาส่ง',person_type:'ประเภท',student_or_staff_id:'รหัสนิสิต/บุคลากร',email:'อีเมลติดต่อ',national_id:'เลขบัตรประชาชน',name_th:'ชื่อ-นามสกุล',name_en:'ชื่อ-นามสกุลภาษาอังกฤษ',sex:'เพศ',dob:'วันเดือนปีเกิด',faculty:'คณะ',faculty_other:'คณะ/หน่วยงานอื่นๆ',weight_kg:'น้ำหนัก (กก.)',height_cm:'ส่วนสูง (ซม.)',phone:'เบอร์โทร',family_name:'ชื่อผู้ปกครอง/คนในครอบครัว',family_phone:'เบอร์โทรผู้ปกครอง/คนในครอบครัว',family_relation:'ความสัมพันธ์',blood_group:'กรุ๊ปเลือด',chronic_disease:'โรคประจำตัว',drug_allergy:'แพ้ยา',food_allergy:'แพ้อาหาร',allergy_symptoms:'อาการแพ้',address_idcard:'ที่อยู่ตามบัตรประชาชน',registration_status:'สถานะเวชระเบียน',triage_status:'สถานะ Triage'};
async function login(){KEY=document.getElementById('key').value||KEY;sessionStorage.setItem('mrkey',KEY);await load()}
async function load(){const r=await fetch('/api/list?role=records',{headers:{'x-dashboard-key':KEY}});if(!r.ok){document.getElementById('authmsg').textContent='รหัสผ่านไม่ถูกต้อง';return}rows=await r.json();document.getElementById('authmsg').textContent='';document.getElementById('panel').classList.remove('hidden');render()}
function render(){const q=(document.getElementById('search').value||'').toLowerCase();const x=rows.filter(r=>[r.queue,r.student_or_staff_id,r.name_th].join(' ').toLowerCase().includes(q));document.getElementById('list').innerHTML=x.map(r=>`<article class="record-card"><div class="record-queue">${esc(r.queue)}</div><div class="record-main"><div class="record-name">${esc(r.name_th||'-')}</div><div class="muted">${esc(r.student_or_staff_id||'-')} · ${esc(r.faculty||'-')}</div><div class="record-time muted">${esc(formatTime(r.submitted_at))}</div></div><div class="record-actions"><span class="badge">${esc(r.registration_status||'รอเวชระเบียน')}</span><button type="button" onclick="openRec('${r.id}')">เรียกดู</button></div></article>`).join('')||'<div class="card muted">ไม่มีรายการภายใน 24 ชั่วโมง</div>'}
function formatTime(iso){try{return new Intl.DateTimeFormat('th-TH',{timeZone:'Asia/Bangkok',hour:'2-digit',minute:'2-digit',day:'2-digit',month:'2-digit'}).format(new Date(iso))}catch(e){return iso||''}}
async function openRec(id){const r=await fetch('/api/record?id='+encodeURIComponent(id),{headers:{'x-dashboard-key':KEY}}), d=await r.json(); if(!r.ok)return alert(d.error||'เปิดข้อมูลไม่ได้');const keys=Object.keys(labels);document.getElementById('detail').innerHTML=`<h2>${esc(d.queue)} · ${esc(d.name_th)}</h2><div class="toolbar"><button onclick="copyAll('${id}')">Copy ทั้งหมด</button><button class="secondary" onclick="openText('${id}')">เปิด Text file</button><button class="secondary" onclick="setDone('${id}')">บันทึกเวชระเบียนแล้ว</button></div><div class="fields">${keys.map(k=>`<div class="field"><b>${esc(labels[k])}</b><div class="value" id="v_${k}">${esc(d[k]||'-')}</div><button class="secondary smallbtn" onclick="copyText('v_${k}')">Copy</button></div>`).join('')}</div>`;document.getElementById('detail').classList.remove('hidden');document.getElementById('detail').scrollIntoView({behavior:'smooth'})}
function copyText(id){navigator.clipboard.writeText(document.getElementById(id).innerText)}
async function copyAll(id){const r=await fetch('/api/record?id='+encodeURIComponent(id),{headers:{'x-dashboard-key':KEY}}),d=await r.json();navigator.clipboard.writeText(Object.keys(labels).map(k=>`${labels[k]}: ${d[k]||'-'}`).join('\n'))}
function openText(id){window.open('/api/text?id='+encodeURIComponent(id)+'&key='+encodeURIComponent(KEY),'_blank')}
async function setDone(id){await fetch('/api/status',{method:'POST',headers:{'Content-Type':'application/json','x-dashboard-key':KEY},body:JSON.stringify({id,role:'records',status:'บันทึกเวชระเบียนแล้ว'})});await load()}
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
if(KEY){document.getElementById('key').value=KEY;load()}
setInterval(()=>{if(KEY)load()},30000);
</script></body></html>
